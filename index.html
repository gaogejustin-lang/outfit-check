<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 16px;
        }
        
        .container { max-width: 480px; margin: 0 auto; }
        
        /* Header */
        .header { text-align: center; color: white; margin-bottom: 16px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header .subtitle { opacity: 0.9; font-size: 13px; margin-top: 4px; }
        
        /* Search */
        .search-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        
        .search-box { display: flex; gap: 8px; }
        
        .search-input {
            flex: 1;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }
        
        .search-input:focus { border-color: #667eea; }
        
        .search-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        
        .search-btn:disabled { opacity: 0.6; }
        
        .hot-cities {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }
        
        .hot-cities-label { font-size: 12px; color: #888; }
        
        .city-tag {
            padding: 5px 12px;
            background: #f5f5f5;
            border: none;
            border-radius: 16px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
        }
        
        /* Loading */
        .loading {
            text-align: center;
            padding: 30px;
            color: white;
            font-size: 14px;
        }
        
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Weather Card */
        .weather-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .location-name { font-size: 18px; font-weight: 600; }
        .location-detail { font-size: 12px; color: #888; margin-top: 2px; }
        
        .date-badge {
            display: inline-block;
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 8px;
        }
        
        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
        }
        
        .weather-icon { font-size: 52px; }
        
        .weather-info { text-align: right; }
        .temp-range { font-size: 28px; font-weight: 700; }
        .weather-desc { font-size: 14px; color: #666; margin-top: 2px; }
        .wind-info { font-size: 12px; color: #888; margin-top: 4px; }
        
        .weather-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .tag {
            background: #f5f5f5;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 12px;
        }
        
        .tag.highlight { background: #667eea; color: white; }
        .tag.cold { background: #e3f2fd; color: #1976d2; }
        .tag.hot { background: #ffebee; color: #c62828; }
        .tag.rain { background: #e8f5e9; color: #2e7d32; }
        
        /* Tips */
        .tips-card {
            background: linear-gradient(135deg, #fff9e6, #fff3cd);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border-left: 3px solid #ffc107;
        }
        
        .tips-title { font-size: 13px; font-weight: 600; color: #856404; }
        .tips-content { font-size: 12px; color: #856404; margin-top: 4px; line-height: 1.5; }
        
        /* Outfit Section */
        .outfit-section { margin-bottom: 12px; }
        
        .section-title {
            color: white;
            font-size: 15px;
            margin-bottom: 8px;
        }
        
        .outfit-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        
        .outfit-image {
            width: 100%;
            height: 180px;
            background: #f5f5f5;
            overflow: hidden;
        }
        
        .outfit-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .outfit-content { padding: 14px; }
        
        .outfit-style {
            font-size: 11px;
            color: #667eea;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .outfit-title { font-size: 15px; font-weight: 600; margin: 4px 0 10px; }
        
        .outfit-items {
            list-style: none;
            font-size: 13px;
            color: #555;
        }
        
        .outfit-items li {
            padding: 6px 0;
            border-bottom: 1px dashed #eee;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .outfit-items li:last-child { border-bottom: none; }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .btn-primary {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #ff2442;
            color: white;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
        }
        
        .btn-secondary {
            padding: 12px 16px;
            background: #f5f5f5;
            color: #555;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary:active { background: #e0203c; }
        .btn-secondary:active { background: #e0e0e0; }
        
        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            margin-top: 20px;
            padding-bottom: 16px;
        }
        
        .hidden { display: none !important; }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 13px;
        }
        
        /* Desktop enhancements */
        @media (min-width: 768px) {
            body { padding: 24px; }
            .container { max-width: 680px; }
            .header h1 { font-size: 28px; }
            
            .outfit-card {
                display: flex;
                flex-direction: row;
            }
            
            .outfit-image {
                width: 280px;
                height: auto;
                min-height: 220px;
            }
            
            .outfit-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            
            .outfit-title { font-size: 17px; }
            .outfit-items { font-size: 14px; }
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 13px;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        
        .toast.show { opacity: 1; }
    </style>
</head>

            if (speed < 5) return { level: '1级', desc: '微风', icon: '🍃' };
            if (speed < 12) return { level: '2-3级', desc: '轻风', icon: '🌿' };

            return { level: '7级+', desc: '大风', icon: '💨' };

                ]
            },
            cool: {

                tags: ['凉爽', '叠穿', '舒适'],
                titles: { commute: '知性优雅 办公室首选', casual: '轻松随性 舒适日常', trendy: '时髦叠穿 春日氛围' },
                items: [

                items: [

        };
        
        // ========== 平台检测 ==========
        const platform = {
            isIOS: /iPhone|iPad|iPod/i.test(navigator.userAgent),
            isAndroid: /Android/i.test(navigator.userAgent),
            isWechat: /MicroMessenger/i.test(navigator.userAgent),
            isMobile: /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        };
        
        // 显示平台信息
        let platformText = '';
        if (platform.isWechat) platformText = '微信内置浏览器';
        else if (platform.isIOS) platformText = 'iOS 设备';
        else if (platform.isAndroid) platformText = 'Android 设备';
        else platformText = '电脑端';
        document.getElementById('platformInfo').textContent = `当前：${platformText}`;
        
        // 根据平台调整按钮文字
        if (platform.isMobile && !platform.isWechat) {
            document.getElementById('commuteBtnText').textContent = '打开小红书App';
            document.getElementById('casualBtnText').textContent = '打开小红书App';
            document.getElementById('trendyBtnText').textContent = '打开小红书App';
        }
        
        // ========== 搜索关键词存储 ==========
        let searchKeywords = {
            commute: '',
            casual: '',
            trendy: ''
        };
        
        // ========== 核心功能 ==========
        function setCity(city) {
            document.getElementById('cityInput').value = city;
            searchCity();
        }
        
        async function searchCity() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) { showError('请输入城市名称'); return; }
            
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorContainer').innerHTML = '';
            document.getElementById('searchBtn').disabled = true;
            
            try {
                const searchName = city.endsWith('市') ? city : city + '市';
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchName)}&count=10&language=zh&format=json`);
                const geoData = await geoRes.json();
                
                if (!geoData.results?.length) throw new Error('未找到该城市，请检查城市名称');
                
                let loc = geoData.results.find(r => r.country_code === 'CN' && (r.name === city || r.name === searchName));
                if (!loc) loc = geoData.results.find(r => r.country_code === 'CN');
                if (!loc) loc = geoData.results[0];
                
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=temperature_2m_max,temperature_2m_min,weather_code&current=wind_speed_10m,wind_direction_10m&timezone=auto&forecast_days=2`);
                const weatherData = await weatherRes.json();
                
                if (!weatherData.daily || !weatherData.current) throw new Error('天气数据格式错误');
                
                updatePage(loc, weatherData);
            } catch (err) {
                console.error(err);
                showError(err.message || '获取天气数据失败');
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('searchBtn').disabled = false;
            }
        }
        
        function showError(msg) {
            document.getElementById('errorContainer').innerHTML = `<div class="error-message">${msg}</div>`;
        }
        
        function updatePage(loc, data) {
            const daily = data.daily;
            const current = data.current;
            const maxT = Math.round(daily.temperature_2m_max[1]);
            const minT = Math.round(daily.temperature_2m_min[1]);
            const code = daily.weather_code[1];
            const wind = getWind(current.wind_speed_10m);
            const windDir = windDirs[Math.round(current.wind_direction_10m / 45) % 8];
            
            const wInfo = weatherCodes[code] || { icon: '☁️', desc: '多云' };
            
            // 位置
            document.getElementById('locationName').textContent = loc.name;
            document.getElementById('locationDetail').textContent = loc.admin1 ? `中国 · ${loc.admin1}` : '中国';
            
            // 日期
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('currentDate').textContent = `${tomorrow.getMonth()+1}月${tomorrow.getDate()}日 星期${days[tomorrow.getDay()]}`;
            
            // 天气
            document.getElementById('weatherIcon').textContent = wInfo.icon;
            document.getElementById('tempRange').textContent = `${minT}° ~ ${maxT}°`;
            document.getElementById('weatherDesc').textContent = wInfo.desc;
            document.getElementById('windInfo').textContent = `${wind.icon} ${windDir}风 ${wind.level} · ${wind.desc}`;
            
            // 体感温度计算
            let avgT = (maxT + minT) / 2;
            const isHighAltitude = loc.elevation > 1500;
            const isSouthernWet = ['广东','广西','福建','海南'].includes(loc.admin1);
            
            if (isHighAltitude) avgT -= 3;
            if (isSouthernWet && avgT < 15) avgT -= 2;
            
            let zone;
            if (avgT < 0) zone = 'freezing';
            else if (avgT < 10) zone = 'cold';
            else if (avgT < 20) zone = 'cool';
            else if (avgT < 28) zone = 'warm';
            else zone = 'hot';
            
            const outfit = outfitDB[zone];
            
            // 标签
            let tagsHtml = outfit.tags.map(t => {
                let cls = zone === 'hot' ? 'hot' : (zone === 'cold' || zone === 'freezing') ? 'cold' : code >= 50 ? 'rain' : 'highlight';
                return `<span class="tag ${cls}">${t}</span>`;
            }).join('');
            
            if (isHighAltitude) tagsHtml += `<span class="tag" style="background:#fff3e0;color:#e65100">☀️ 高海拔</span>`;
            if (isSouthernWet && avgT < 15) tagsHtml += `<span class="tag" style="background:#e8f5e9;color:#2e7d32">💧 湿冷</span>`;
            
            document.getElementById('weatherTags').innerHTML = tagsHtml;
            
            // 提示
            let tips = outfit.tips;
            if (isHighAltitude) tips += ' 高原紫外线强，注意防晒。';
            if (isSouthernWet && avgT < 15) tips += ' 南方湿冷，建议穿防水外套。';
            document.getElementById('tipsContent').textContent = tips;
            
            // 图片
            document.getElementById('commuteImage').innerHTML = `<img src="${outfitImgs[zone]}" alt="通勤">`;
            document.getElementById('casualImage').innerHTML = `<img src="${outfitImgs[zone]}" alt="休闲">`;
            document.getElementById('trendyImage').innerHTML = `<img src="${outfitImgs[zone]}" alt="时髦">`;
            
            // 标题和列表
            document.getElementById('commuteTitle').textContent = outfit.titles.commute;
            document.getElementById('casualTitle').textContent = outfit.titles.casual;
            document.getElementById('trendyTitle').textContent = outfit.titles.trendy;
            
            const itemsHtml = outfit.items.map(i => `<li>${i}</li>`).join('');
            document.getElementById('commuteItems').innerHTML = itemsHtml;
            document.getElementById('casualItems').innerHTML = itemsHtml;
            document.getElementById('trendyItems').innerHTML = itemsHtml;
            
            // 保存搜索关键词
            const cityName = loc.name.replace('（示例）', '');
            searchKeywords.commute = `${cityName} 通勤穿搭 ${maxT}度`;
            searchKeywords.casual = `${cityName} 休闲穿搭`;
            searchKeywords.trendy = `${cityName} 时尚穿搭`;
        }
        
        // ========== 小红书链接处理 ==========
        function handleAction(type) {
            const keyword = searchKeywords[type];
            if (!keyword) return;
            
            // 电脑端：直接打开网页
            if (!platform.isMobile) {
                window.open(`https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}`, '_blank');
                return;
            }
            
            // 手机端：尝试打开App
            const encodedKeyword = encodeURIComponent(keyword);
            let scheme;
            
            if (platform.isIOS) {
                scheme = `xhsdiscover://search/result?keyword=${encodedKeyword}`;
            } else {
                scheme = `xhsdiscovery://search/result?keyword=${encodedKeyword}`;
            }
            
            // 记录打开时间
            const startTime = Date.now();
            
            // 尝试打开App
            window.location.href = scheme;
            
            // 2秒后检查是否成功打开
            setTimeout(() => {
                const endTime = Date.now();
                // 如果时间差小于2秒，说明App没有打开（用户还在当前页面）
                if (endTime - startTime < 2200) {
                    // 显示提示
                    showToast('正在打开小红书...');
                    
                    // 再等待一下，如果没跳转，提供备选方案
                    setTimeout(() => {
                        if (confirm('未检测到小红书App，是否使用网页版查看？')) {
                            window.open(`https://www.xiaohongshu.com/search_result?keyword=${encodedKeyword}`, '_blank');
                        }
                    }, 500);
                }
            }, 2000);
        }
        
        function copyLink(type) {
            const keyword = searchKeywords[type];
            if (!keyword) return;
            
            const url = `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}`;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('链接已复制到剪贴板！');
                }).catch(() => {
                    // 降级方案
                    const input = document.createElement('input');
                    input.value = url;
                    document.body.appendChild(input);
                    input.select();
                    document.execCommand('copy');
                    document.body.removeChild(input);
                    showToast('链接已复制！');
                });
            } else {
                showToast(url);
            }
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        // ========== 初始化 ==========
        window.addEventListener('load', () => {
            updatePage(
                { name: '北京', admin1: '北京', elevation: 50 },
                { daily: { temperature_2m_max: [0,15], temperature_2m_min: [0,2], weather_code: [0,3] },
                  current: { wind_speed_10m: 5, wind_direction_10m: 45 } }
            );
        });
        
        document.getElementById('cityInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchCity();
        });
    </script>
</body>
</html>
