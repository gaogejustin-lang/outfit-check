            padding: 30px;
            color: white;
            font-size: 14px;
        }

            height: 36px;

            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;

            color: #667eea;
            font-weight: 600;

            color: white;
            padding: 12px;

            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border: none;

            color: #555;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            border: none;

            }

        let searchKeywords = { commute: '', casual: '', trendy: '' };
        
        // ========== 核心功能 ==========
        function setCity(city) {
            document.getElementById('cityInput').value = city;
            searchCity();
        }
        
        async function searchCity() {
            const cityInput = document.getElementById('cityInput').value.trim();
            if (!cityInput) { showError('请输入城市名称'); return; }
            
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorContainer').innerHTML = '';
            document.getElementById('searchBtn').disabled = true;
            
            try {
                let location;
                
                // 1. 先检查是否是主要城市（精确匹配）
                const cityKey = cityInput.replace(/市$/, '');
                if (majorCities[cityKey]) {
                    const cityData = majorCities[cityKey];
                    location = {
                        name: cityKey,
                        latitude: cityData.lat,
                        longitude: cityData.lon,
                        admin1: cityData.admin1,
                        country: cityData.country || '中国',
                        elevation: 50
                    };
                } else {
                    // 2. API搜索其他城市
                    const searchName = cityInput.endsWith('市') ? cityInput : cityInput + '市';
                    const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchName)}&count=20&language=zh&format=json`);
                    const geoData = await geoRes.json();
                    
                    if (!geoData.results?.length) throw new Error('未找到该城市，请检查城市名称');
                    
                    // 严格筛选：优先中国大陆，也支持国际城市
                    let chinaResults = geoData.results.filter(r => 
                        r.country_code === 'CN' && r.country === '中国'
                    );
                    
                    // 如果没有找到中国城市，搜索国际城市
                    if (!chinaResults.length) {
                        chinaResults = geoData.results.filter(r => 
                            ['US','GB','JP','KR','SG','TH','MY','ID','PH','VN','AU','CA','FR','DE','IT','ES','NL','CH','RU','AE','TR','EG','ZA','NZ','IN','BR','MX','AR'].includes(r.country_code)
                        );
                    }
                    
                    if (!chinaResults.length) throw new Error('未找到该城市，请尝试其他城市名称');
                    
                    // 优先选择省辖市级别的（通常人口更多）
                    const selected = chinaResults.find(r => r.feature_code === 'PPLA') || 
                               chinaResults.find(r => r.population && r.population > 100000) ||
                               chinaResults[0];
                    
                    location = {
                        name: selected.name,
                        latitude: selected.latitude,
                        longitude: selected.longitude,
                        admin1: selected.admin1,
                        country: selected.country || '中国',
                        elevation: selected.elevation || 50
                    };
                }
                
                // 3. 获取天气数据
                const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${location.latitude}&longitude=${location.longitude}&daily=temperature_2m_max,temperature_2m_min,weather_code&current=wind_speed_10m,wind_direction_10m&timezone=auto&forecast_days=2`);
                const weatherData = await weatherRes.json();
                
                if (!weatherData.daily || !weatherData.current) throw new Error('天气数据格式错误');
                
                updatePage(location, weatherData);
            } catch (err) {
                console.error(err);
                showError(err.message || '获取天气数据失败');
            } finally {
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('searchBtn').disabled = false;
            }
        }
        
        function showError(msg) {
            document.getElementById('errorContainer').innerHTML = `<div class="error-message">${msg}</div>`;
        }
        
        function updatePage(loc, data) {
            const daily = data.daily;
            const current = data.current;
            const maxT = Math.round(daily.temperature_2m_max[1]);
            const minT = Math.round(daily.temperature_2m_min[1]);
            const code = daily.weather_code[1];
            const wind = getWind(current.wind_speed_10m);
            const windDir = windDirs[Math.round(current.wind_direction_10m / 45) % 8];
            
            const wInfo = weatherCodes[code] || { icon: '☁️', desc: '多云' };
            
            // 位置信息
            document.getElementById('locationName').textContent = loc.name;
            const countryName = loc.country || '中国';
            document.getElementById('locationDetail').textContent = loc.admin1 ? `${countryName} · ${loc.admin1}` : countryName;
            
            // 日期
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('currentDate').textContent = `${tomorrow.getMonth()+1}月${tomorrow.getDate()}日 星期${days[tomorrow.getDay()]}`;
            
            // 天气
            document.getElementById('weatherIcon').textContent = wInfo.icon;
            document.getElementById('tempRange').textContent = `${minT}° ~ ${maxT}°`;
            document.getElementById('weatherDesc').textContent = wInfo.desc;
            document.getElementById('windInfo').textContent = `${wind.icon} ${windDir}风 ${wind.level} · ${wind.desc}`;
            
            // 计算温度区间（使用平均温度）
            const avgT = (maxT + minT) / 2;
            
            let zone;
            if (avgT < 0) zone = 'freezing';
            else if (avgT < 10) zone = 'cold';
            else if (avgT < 20) zone = 'cool';
            else if (avgT < 28) zone = 'warm';
            else zone = 'hot';
            
            const outfit = outfitDB[zone];
            
            // 标签
            let tagsHtml = outfit.tags.map(t => {
                let cls = zone === 'hot' ? 'hot' : (zone === 'cold' || zone === 'freezing') ? 'cold' : code >= 50 ? 'rain' : 'highlight';
                return `<span class="tag ${cls}">${t}</span>`;
            }).join('');
            document.getElementById('weatherTags').innerHTML = tagsHtml;
            
            // 提示
            document.getElementById('tipsContent').textContent = outfit.tips;
            
            // 图片 - 每种风格独立配图
            document.getElementById('commuteImage').innerHTML = `<img src="${outfitImgs[zone].commute}" alt="通勤">`;
            document.getElementById('casualImage').innerHTML = `<img src="${outfitImgs[zone].casual}" alt="休闲">`;
            document.getElementById('trendyImage').innerHTML = `<img src="${outfitImgs[zone].trendy}" alt="时髦">`;
            
            // 标题和列表 - 三种风格完全不同
            document.getElementById('commuteTitle').textContent = outfit.commute.title;
            document.getElementById('casualTitle').textContent = outfit.casual.title;
            document.getElementById('trendyTitle').textContent = outfit.trendy.title;
            
            document.getElementById('commuteItems').innerHTML = outfit.commute.items.map(i => `<li>${i}</li>`).join('');
            document.getElementById('casualItems').innerHTML = outfit.casual.items.map(i => `<li>${i}</li>`).join('');
            document.getElementById('trendyItems').innerHTML = outfit.trendy.items.map(i => `<li>${i}</li>`).join('');
            
            // 保存搜索关键词
            searchKeywords.commute = `${loc.name} 通勤穿搭 ${maxT}度`;
            searchKeywords.casual = `${loc.name} 休闲穿搭`;
            searchKeywords.trendy = `${loc.name} 时尚穿搭`;
        }
        
        // ========== 小红书链接处理 ==========
        function handleAction(type) {
            const keyword = searchKeywords[type];
            if (!keyword) return;
            
            if (!platform.isMobile) {
                window.open(`https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}`, '_blank');
                return;
            }
            
            const encodedKeyword = encodeURIComponent(keyword);
            const scheme = platform.isIOS 
                ? `xhsdiscover://search/result?keyword=${encodedKeyword}`
                : `xhsdiscovery://search/result?keyword=${encodedKeyword}`;
            
            window.location.href = scheme;
            
            setTimeout(() => {
                if (confirm('未检测到小红书App，是否使用网页版查看？')) {
                    window.open(`https://www.xiaohongshu.com/search_result?keyword=${encodedKeyword}`, '_blank');
                }
            }, 2000);
        }
        
        function copyLink(type) {
            const keyword = searchKeywords[type];
            if (!keyword) return;
            
            const url = `https://www.xiaohongshu.com/search_result?keyword=${encodeURIComponent(keyword)}`;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(url).then(() => showToast('链接已复制！'));
            } else {
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('链接已复制！');
            }
        }
        
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }
        
        // ========== 初始化 ==========
        window.addEventListener('load', () => {
            updatePage(
                { name: '北京', admin1: '北京', elevation: 50 },
                { daily: { temperature_2m_max: [0,15], temperature_2m_min: [0,2], weather_code: [0,3] },
                  current: { wind_speed_10m: 5, wind_direction_10m: 45 } }
            );
        });
        
        document.getElementById('cityInput').addEventListener('keypress', e => {
            if (e.key === 'Enter') searchCity();
        });
    </script>
</body>
</html>
